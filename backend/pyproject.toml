[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-supervisor"
version = "0.5.0"
description = "Supervisor independiente de solo lectura para bots de trading en MT5"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.6.1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
supervisor-cli = "supervisor.cli:main"
supervisor-worker = "supervisor.worker.main:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["supervisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones autogeneradas por Alembic se dejan tal como salen.
"migrations/versions/*" = ["E501"]
"tests/*" = ["E501"]
