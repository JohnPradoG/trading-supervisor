{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="login card">
  <h1>Trading Supervisor</h1>
  <p class="muted">Introduce el token de administración (<code>SUPERVISOR_ADMIN_TOKEN</code>).</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/dashboard/login" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">Token</label>
    <input id="token" name="token" type="password" required autofocus maxlength="512"
           autocomplete="current-password" spellcheck="false">
    <button type="submit" class="btn">Entrar</button>
  </form>
</section>
{% endblock %}
