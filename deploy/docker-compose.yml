# Trading Supervisor · Fase 2
# Uso (desde la carpeta deploy/):
#   cp .env.example .env   # y completar las claves
#   docker compose up -d --build
# Servicios: postgres (base de datos) y migrate (aplica el esquema y termina).
# La API, el worker y Caddy se añaden en la fase 3.

name: trading-supervisor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supervisor}
      POSTGRES_USER: ${POSTGRES_USER:-supervisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      TZ: UTC
      PGTZ: UTC
    command:
      # Ajustado a un VPS de 1 vCPU y 3.8 GB de RAM compartidos con la API y el worker.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde el propio VPS (para backups y mantenimiento), nunca desde internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SUPERVISOR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supervisor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supervisor}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
