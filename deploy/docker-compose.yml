# Trading Supervisor · Fase 6
# Uso (desde la carpeta deploy/):
#   cp .env.example .env   # y completar las claves y el dominio
#   docker compose up -d --build
# Servicios:
#   postgres  base de datos (solo accesible desde el propio VPS)
#   migrate   aplica las migraciones y termina; la API espera a que acabe bien
#   api       FastAPI (solo accesible a través de Caddy)
#   worker    convierte los eventos del EA en operaciones (trades) y las analiza; sin puertos
#   caddy     HTTPS automático con Let's Encrypt en los puertos 80/443

name: trading-supervisor

x-app-env: &app-env
  SUPERVISOR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supervisor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supervisor}
  SUPERVISOR_ADMIN_TOKEN: ${SUPERVISOR_ADMIN_TOKEN:?Define SUPERVISOR_ADMIN_TOKEN en deploy/.env}
  SUPERVISOR_LOG_LEVEL: ${SUPERVISOR_LOG_LEVEL:-INFO}
  SUPERVISOR_DB_POOL_SIZE: "3"
  # Análisis y estadísticas: la API y el worker deben usar los mismos valores.
  SUPERVISOR_BREAKEVEN_R_FRACTION: ${SUPERVISOR_BREAKEVEN_R_FRACTION:-0.05}
  SUPERVISOR_STATS_MIN_SAMPLE: ${SUPERVISOR_STATS_MIN_SAMPLE:-30}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supervisor}
      POSTGRES_USER: ${POSTGRES_USER:-supervisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      TZ: UTC
      PGTZ: UTC
    command:
      # Ajustado a un VPS de 1 vCPU y 3.8 GB de RAM compartidos con la API y el worker.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde el propio VPS (para backups y mantenimiento), nunca desde internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trading-supervisor:latest
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    image: trading-supervisor:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sin puertos publicados: solo Caddy llega a la API por la red interna de Docker.
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  worker:
    image: trading-supervisor:latest
    command: ["supervisor-worker"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SUPERVISOR_WORKER_POLL_INTERVAL_SECONDS: ${SUPERVISOR_WORKER_POLL_INTERVAL_SECONDS:-2}
      SUPERVISOR_REENTRY_WINDOW_MINUTES: ${SUPERVISOR_REENTRY_WINDOW_MINUTES:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Con SIGTERM termina el lote en curso (segundos) y sale; se le da margen de sobra.
    stop_grace_period: 30s
    # La imagen comprueba la API en :8000; el worker no escucha puertos: se comprueba que
    # siga dando vueltas (toca este archivo en cada una).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/supervisor-worker.alive') < 120 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SUPERVISOR_DOMAIN: ${SUPERVISOR_DOMAIN:?Define SUPERVISOR_DOMAIN en deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
